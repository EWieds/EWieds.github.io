name: Lazer Arcade backend (standalone)

# Backend for the standalone Lazer Arcade on the project we own (lazer-arcade).
# Deploys Firestore rules, keeps the project configured (Firestore DB + authorized
# domains), syncs staff roles/early-access/creator earnings, and mirrors feedback
# tickets into this repo's Issues.
# Needs repository secret: FB_NEW_SA (service-account JSON for the new project).

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "arcade/roles.json"
      - "arcade/creators.json"
      - "arcade/tiers.json"
      - ".github/arcade-access.json"
      - "arcade/community/seed/**"
      - ".github/workflows/arcade-backend.yml"
      - ".github/scripts/**"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: arcade-backend-standalone
  cancel-in-progress: false

jobs:
  rules:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: s
        env: { SA: "${{ secrets.FB_NEW_SA }}" }
        run: if [ -n "$SA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::FB_NEW_SA not set; skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.s.outputs.ok == '1'
        with: { node-version: "20" }
      - name: Project setup (Firestore DB + authorized domains)
        if: steps.s.outputs.ok == '1'
        env: { SA: "${{ secrets.FB_NEW_SA }}" }
        run: |
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i firebase-admin@13 >/dev/null
          NODE_PATH="$RUNNER_TEMP/node_modules" node "$GITHUB_WORKSPACE/.github/scripts/arcade-setup.js"
      - name: Deploy Firestore rules
        if: steps.s.outputs.ok == '1'
        env: { SA: "${{ secrets.FB_NEW_SA }}" }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PID=$(node -e "console.log(JSON.parse(process.env.SA).project_id)")
          npx --yes firebase-tools@13 deploy --only firestore:rules --project "$PID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Sync staff roles
        if: steps.s.outputs.ok == '1'
        env: { SA: "${{ secrets.FB_NEW_SA }}" }
        run: |
          cd "$RUNNER_TEMP" && npm i firebase-admin@13 >/dev/null
          NODE_PATH="$RUNNER_TEMP/node_modules" node "$GITHUB_WORKSPACE/.github/scripts/sync-arcade-roles.js" "$GITHUB_WORKSPACE/arcade/roles.json"

  tickets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: s
        env: { SA: "${{ secrets.FB_NEW_SA }}" }
        run: if [ -n "$SA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::FB_NEW_SA not set; skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.s.outputs.ok == '1'
        with: { node-version: "20" }
      - name: Sync tickets to Issues
        if: steps.s.outputs.ok == '1'
        env:
          SA: "${{ secrets.FB_NEW_SA }}"
          GH_TOKEN: "${{ github.token }}"
          REPO: "${{ github.repository }}"
        run: |
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i firebase-admin@13 >/dev/null
          NODE_PATH="$RUNNER_TEMP/node_modules" node "$GITHUB_WORKSPACE/.github/scripts/sync-arcade-tickets.js"

  creators:
    runs-on: ubuntu-latest
    needs: tickets
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: s
        env: { SA: "${{ secrets.FB_NEW_SA }}" }
        run: if [ -n "$SA" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.s.outputs.ok == '1'
        with: { node-version: "20" }
      - name: Credit creators + sync access
        if: steps.s.outputs.ok == '1'
        env: { SA: "${{ secrets.FB_NEW_SA }}" }
        run: |
          cd "$RUNNER_TEMP" && npm init -y >/dev/null && npm i firebase-admin@13 >/dev/null
          NODE_PATH="$RUNNER_TEMP/node_modules" node "$GITHUB_WORKSPACE/.github/scripts/seed-community.js" "$GITHUB_WORKSPACE"
          NODE_PATH="$RUNNER_TEMP/node_modules" node "$GITHUB_WORKSPACE/.github/scripts/creator-earnings.js" "$GITHUB_WORKSPACE"
          NODE_PATH="$RUNNER_TEMP/node_modules" node "$GITHUB_WORKSPACE/.github/scripts/sync-arcade-access.js" "$GITHUB_WORKSPACE/.github/arcade-access.json"
