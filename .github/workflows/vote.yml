name: Update vote scoreboard
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's fastest; runs can lag a few minutes at busy times
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: vote
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node vote/update.mjs
      - name: Commit if changed
        run: |
          git config user.name "vote-bot"
          git config user.email "vote-bot@users.noreply.github.com"
          git add vote/scores.json vote/scoreboard.svg
          git diff --cached --quiet || (git commit -m "Update vote scores" && git push)
