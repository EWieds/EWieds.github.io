<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Lazer Arcade</title>
  <style>
    body{background:#0a0a0a;color:#00d1b2;font-family:sans-serif;margin:0}
    .card{background:#1a1a1a;border:1px solid #00d1b2;padding:30px;border-radius:12px;width:100%;max-width:450px;box-sizing:border-box;margin:120px auto 0 auto;}
    h2{font-size:32px;text-align:center}
    label{display:block;margin-top:20px;font-size:15px}
    input,button{width:100%;padding:10px;margin-top:5px;border-radius:6px;box-sizing:border-box}
    input{background:#2a2a2a;border:1px solid #333;color:#fff}
    button{background:#00d1b2;border:none;color:#0a0a0a;font-weight:bold;cursor:pointer;margin-top:25px;font-size:20px}
    button.google{background:#fff;color:#222;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;font-size:16px}
    .or{display:flex;align-items:center;gap:10px;color:#666;margin-top:20px;font-size:13px}
    .or::before,.or::after{content:"";flex:1;height:1px;background:#333}
    .msg{text-align:center;margin-top:15px}
    .note{text-align:center;margin-top:14px;color:#9ad;font-size:13px;line-height:1.5}
    .show-pw-container{display:flex;align-items:center;gap:8px;margin-top:10px}
    .show-pw-container input{width:auto;margin:0;cursor:pointer;accent-color:#00d1b2}
    .show-pw-container label{margin:0;font-size:14px;color:#ccc;cursor:pointer}
    .stay-signed-in-container{display:flex;align-items:center;gap:8px;margin-top:12px;color:#ccc;font-size:14px}
    .stay-signed-in-container input{width:auto;margin:0;accent-color:#00d1b2}
    .stay-signed-in-container label{margin:0;cursor:pointer}
  </style>
<script src="/shabbos-gate.js"></script>
</head>
<body>
  <script src="/nav-bar.js"></script>
  <div class="card">
    <h2>Sign In</h2>
    <div class="note" id="welcome">Welcome to the new Lazer Arcade. If this is your first visit, just enter your usual email and pick a password — it becomes your new password, and all your scores and saves are already here.</div>
    <form id="login-form">
      <label for="email">Email Address</label>
      <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      <div class="show-pw-container">
        <input type="checkbox" id="toggle-password">
        <label for="toggle-password">Show password</label>
      </div>
      <div class="stay-signed-in-container">
        <input type="checkbox" id="stay-signed-in" checked>
        <label for="stay-signed-in">Stay signed in on this device</label>
      </div>
      <button type="submit">Sign In</button>
    </form>
    <div class="or">or</div>
    <button type="button" class="google" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.6 2.4 30.1 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 6.9l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16.9z"/><path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.1 0 11.3-2 15-5.5l-7.1-5.5c-2 1.3-4.6 2.1-7.9 2.1-6.3 0-11.7-3.7-13.6-9.4l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div id="msg" class="msg"></div>
    <div style="text-align:center;margin-top:18px;color:#ccc">
      <a href="/arcade/auth/reset-password" style="color:#00d1b2">Forgot your password?</a><br><br>
      Don't have an account? <a href="/arcade/auth/sign-up" style="color:#00d1b2">Sign Up</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      browserLocalPersistence, browserSessionPersistence, getAuth, setPersistence,
      signInWithEmailAndPassword, updatePassword, signInWithPopup, GoogleAuthProvider
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const app = initializeApp({ apiKey: "AIzaSyArTaxXErhHQZ07rwLIOI_qoWCQOyHF4A8", authDomain: "lazer-arcade.firebaseapp.com", projectId: "lazer-arcade" });
    const auth = getAuth(app);
    // One-time placeholder password set on migrated accounts; used behind the scenes
    // so a returning player just types a new password once (no reset email).
    const MIG = "lzmig_042032c5780167d80d95";

    const passwordInput = document.getElementById("password");
    document.getElementById("toggle-password").addEventListener("change", (e) => {
      passwordInput.type = e.target.checked ? "text" : "password";
    });

    function persist() {
      const stay = document.getElementById("stay-signed-in").checked;
      try { stay ? localStorage.setItem("signIn", "true") : localStorage.removeItem("signIn"); } catch (e) {}
      return setPersistence(auth, stay ? browserLocalPersistence : browserSessionPersistence);
    }
    function done() {
      const msg = document.getElementById("msg");
      msg.style.color = "#00d1b2"; msg.textContent = "Signed in!";
      window.location.href = sessionStorage.getItem("prevPage") || "/arcade/";
    }
    const isBadCred = (c) => ["auth/invalid-credential", "auth/wrong-password", "auth/invalid-login-credentials", "auth/user-not-found"].includes(c);

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg"); msg.style.color = "#f00"; msg.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        await persist();
        await signInWithEmailAndPassword(auth, email, password);
        return done();
      } catch (err) {
        if (!isBadCred(err.code)) { msg.textContent = "Couldn't sign in. Try again."; return; }
        // Maybe a migrated account still on the placeholder — claim it with this password.
        try {
          const cred = await signInWithEmailAndPassword(auth, email, MIG);
          await updatePassword(cred.user, password);
          return done();
        } catch (err2) {
          msg.textContent = "Incorrect email or password.";
        }
      }
    });

    document.getElementById("google-btn").addEventListener("click", async () => {
      const msg = document.getElementById("msg"); msg.style.color = "#f00"; msg.textContent = "";
      try { await persist(); await signInWithPopup(auth, new GoogleAuthProvider()); return done(); }
      catch (err) {
        if (err.code === "auth/account-exists-with-different-credential")
          msg.textContent = "That email already uses a password. Sign in with email and password above.";
        else if (err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request")
          msg.textContent = "Google sign-in didn't complete.";
      }
    });
  </script>
</body>
</html>
